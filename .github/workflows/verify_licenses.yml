name: Verificar brevetes

on:
  schedule:
    # Cada hora, para que un conductor nuevo no espere al dia siguiente.
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Firebase Admin
        run: npm install firebase-admin

      - name: Consultar y actualizar brevetes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LICENSE_API_URL: ${{ secrets.LICENSE_API_URL }}
          LICENSE_API_TOKEN: ${{ secrets.LICENSE_API_TOKEN }}
        run: node scripts/verify_licenses.cjs
