name: Compilar la app

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar la versión de depuración
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Pruebas unitarias
        if: success() || failure()
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Guardar el APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pasajeya-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Guardar los reportes de prueba
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-prueba
          path: app/build/reports/
          if-no-files-found: ignore
