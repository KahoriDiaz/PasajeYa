name: Compilar la app

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Un push nuevo cancela la compilacion anterior de la misma rama.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar la versión de depuración
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Pruebas unitarias
        if: success() || failure()
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Guardar el APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pasajeya-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar el APK como descarga directa
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PasajeYa-demo.apk
          gh release view apk-demo >/dev/null 2>&1 || gh release create apk-demo \
            --title "APK de demostración" \
            --notes "Instalable de la última compilación. Desinstala primero cualquier versión anterior de PasajeYa, porque está firmada con otra llave."
          # GitHub a veces responde 500 al reemplazar el archivo anterior. Se reintenta y,
          # si no cede, se sube con el numero de compilacion para que siempre haya un APK
          # descargable.
          for intento in 1 2 3; do
            if gh release upload apk-demo PasajeYa-demo.apk --clobber; then
              echo "APK publicado como PasajeYa-demo.apk"
              exit 0
            fi
            echo "Reintento $intento del envio del APK"
            sleep 20
          done
          alterno="PasajeYa-demo-${{ github.run_number }}.apk"
          cp PasajeYa-demo.apk "$alterno"
          gh release upload apk-demo "$alterno"
          echo "APK publicado como $alterno"


      - name: Guardar los reportes de prueba
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-prueba
          path: app/build/reports/
          if-no-files-found: ignore
