name: Herramientas de la presentacion
on:
  push:
    branches: [herramientas]
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
      - run: true
      - run: bash tools/probe_fuel.sh
      - name: Guardar resultados en la rama
        run: |
          rm -f out/fuel/cookies.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add out
          git commit -m "Resultados de las herramientas [skip ci]" || true
          git push
