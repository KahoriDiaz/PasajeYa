name: Herramientas de la presentacion
on:
  push:
    branches: [herramientas]
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/fetch_photos.sh
      - uses: actions/upload-artifact@v4
        with: { name: fotos, path: out/fotos }
  diesel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/probe_fuel.sh
      - uses: actions/upload-artifact@v4
        with: { name: diesel, path: out/fuel }
